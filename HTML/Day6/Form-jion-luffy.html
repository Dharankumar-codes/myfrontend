<html>

<head>
    <title>Join Luffycrew</title>
</head>

<body>
    <section>
        <center><header><div><img src="../Assets/Images/OnePiece.jpg" alt="banner"></div></header><br>
            <div><h1><mark><u>Join the Future Pirate King's Crew</u></mark></h1></div><br>
            <form>
                <div>
                    <label>Enter your Name : </label>
                    <input type="text" required placeholder="Enter your Name" />
                    <br><br>
                    <label>Pirate Name : </label>
                    <input type="text" placeholder="Enter your Pirate Name" />
                    <br><br>
                    <label>Age : </label>
                    <input type="number" min="18" max="30" />
                    <br><br>
                    <label>Email : </label>
                    <input type="email" required placeholder="Enter your email" />
                    <br><br>
                    <label>Contact No :</label>
                    <input type="tel" min="10" max="10" required placeholder="Mobile No" />
                    <br><br>
                    <label>Home Island</label>
                    <input type="text" placeholder="Enter your Island" />
                    <br><br>
                    <label>Dream : </label>
                    <input type="text" required placeholder="Enter your Dream" />
                    <br><br>
                    <label>Gender : </label>
                    <input type="radio" name="gender" />Male
                    <input type="radio" name="gender" />Female
                    <br><br>
                    <label>Special Skills : </label>
                    <input type="checkbox" name="Skills" />SwordsMan
                    <input type="checkbox" name="Skills" />Ship Navigator
                    <input type="checkbox" name="Skills" />Ship Cook
                    <input type="checkbox" name="Skills" />Ship Doctor
                    <br><br>
                    <label>Sailing Experiance : </label>
                    <input type="radio" name="Experiance" />yes
                    <input type="radio" name="Experiance" />No
                    <br><br>
                    <label>Rate your treasue Hunting Skill : </label>
                    <input type="number" min="0" max="10" />
                    <br><br>
                    <label>Devil Fruit Power : </label>
                    <input type="radio" name="User" />Yes
                    <input type="radio" name="User" />No
                    <br><br>
                    <label>Bounty Amount : </label>
                    <input type="number" />
                    <br><br>
                    <label>Availability to Set Sail</label>
                    <input type="date" />
                    <br><br>
                    <label>Your Opinion on Freedom</label>
                    <input type="text" required placeholder="Enter your opinion" />
                    <br><br>
                    <input type="submit" value="Join crew" />
                </div>
            </form>
        </center>
    </section>

</body>

</html>
