<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Tasks</title>
</head>
<body>

    <!-- Task 1 -->
    <h1 id="title">Welcome</h1>

    <!-- Task 2 -->
    <p class="course">React</p>

    <!-- Task 3 -->
    <input id="username" type="text">

    <!-- Task 4 -->
    <img id="hero" src="old.jpg" width="200">

    <!-- Task 5 -->
    <br><br>
    <a id="website" href="#">Visit</a>

    <script>
        // Task 1
        document.getElementById("title").innerText =
            "Welcome to JavaScript DOM";

        // Task 2
        document.querySelector(".course").innerText =
            "MERN Stack";

        // Task 3
        document.getElementById("username").value =
            "Sudhan";

        // Task 4
        document.querySelector("#hero").src =
            "../../CSS/Assets/images/dharan1.jpeg"; // Replace with your image path

        // Task 5
        document.getElementById("website").href =
            "https://google.com";
    </script>

</body>
</html>
