<script>// Data Types

// Number
let productPrice = 999;
console.log(typeof productPrice, productPrice, "productPrice");

// String
let userName = "Dharan";
console.log(typeof userName, userName, "userName");

// Boolean
let isActive = true;
console.log(typeof isActive, isActive, "isActive");

// Undefined
let courseName;
console.log(typeof courseName, courseName, "courseName");

// Null
let userFeedback = null;
console.log(typeof userFeedback, userFeedback, "userFeedback");</script>
