<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Methods Tasks</title>
</head>
<body>

<script>

// Task 1 – push() Method

let courses = ["HTML", "CSS", "JavaScript"];

courses.push("React");
courses.push("Node.js");

console.log("Task 1 Output:");
console.log(courses);


// Task 2 – pop() Method

let technologies = ["HTML", "CSS", "JavaScript", "React"];

let removedTech = technologies.pop();

console.log("Task 2 Output:");
console.log("Removed Element:", removedTech);
console.log("Updated Array:", technologies);


// Task 3 – shift() Method

let fruits = ["Apple", "Mango", "Orange", "Banana"];

let removedFruit = fruits.shift();

console.log("Task 3 Output:");
console.log("Removed Fruit:", removedFruit);
console.log("Updated Array:", fruits);


// Task 4 – unshift() Method

let heroes = ["Ajith", "Suriya", "SK"];

heroes.unshift("Vijay");
heroes.unshift("Dhanush");

console.log("Task 4 Output:");
console.log(heroes);


// Task 5 – splice() Method

let skills = ["HTML", "CSS", "Bootstrap", "React"];

skills.splice(2, 1, "JavaScript");

console.log("Task 5 Output:");
console.log(skills);

</script>

</body>
</html>
