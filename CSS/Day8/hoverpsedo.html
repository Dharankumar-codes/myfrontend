<!DOCTYPE html>

</head>

    <div class="card-container">

        <div class="card">
            <img src="../Assets/images/trillionareimage/bag.jpg" alt="Bag">

        <div class="card">
            <img src="../Assets/images/trillionareimage/belt.webp" alt="Belt">
