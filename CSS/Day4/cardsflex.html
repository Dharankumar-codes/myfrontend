<!DOCTYPE html>
<html>
<head>
    <title>Responsive Flexbox Cards</title>
    <link rel="stylesheet" href="../Assets/css/cardsflex.css">
</head>

<body>

<div class="container">

    <div class="card">
        <img src="../Assets/images/nature.avif" alt="Image">
        <div class="card-content">
            <h2>Nature</h2>
            <p>Beautiful landscape view.</p>
            <button class="btn">View</button>
        </div>
    </div>

    <div class="card">
        <img src="../Assets/images/mountain.webp" alt="Image">
        <div class="card-content">
            <h2>Mountains</h2>
            <p>Explore amazing places.</p>
            <button class="btn">View</button>
        </div>
    </div>

    <div class="card">
        <img src="../Assets/images/ocean.webp" alt="Image">
        <div class="card-content">
            <h2>Ocean</h2>
            <p>Enjoy peaceful scenery.</p>
            <button class="btn">View</button>
        </div>
    </div>

</div>

</body>
</html>
