<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.sidebar{
    min-height:100vh;
}
</style>
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 bg-dark text-white sidebar p-3">
            <h3>Admin</h3>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="#" class="nav-link text-white">Dashboard</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">Users</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">Courses</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">Reports</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">Settings</a></li>
            </ul>
        </div>

        <div class="col-md-10 p-4">

            <h2>Dashboard</h2>

            <div class="row g-3 my-3">

                <div class="col-md-3">
                    <div class="card text-center bg-primary text-white">
                        <div class="card-body">
                            <h3>120</h3>
                            <p>Users</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center bg-success text-white">
                        <div class="card-body">
                            <h3>50</h3>
                            <p>Courses</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center bg-warning">
                        <div class="card-body">
                            <h3>75</h3>
                            <p>Reports</p>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card text-center bg-danger text-white">
                        <div class="card-body">
                            <h3>20</h3>
                            <p>Settings</p>
                        </div>
                    </div>
                </div>

            </div>

            <h3>Recent Users</h3>

            <div class="table-responsive">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Dharan</td>
                            <td>dharan@gmail.com</td>
                        </tr>

                        <tr>
                            <td>2</td>
                            <td>Arun</td>
                            <td>arun@gmail.com</td>
                        </tr>

                        <tr>
                            <td>3</td>
                            <td>Kumar</td>
                            <td>kumar@gmail.com</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </div>
</div>

</body>
</html>
