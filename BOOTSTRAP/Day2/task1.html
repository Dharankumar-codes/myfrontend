<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course Cards</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

.card{
    transition:0.3s;
}

.card-img-top{
    width: 100%;
    height: 240px;
    object-fit: cover;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}
</style>
</head>
<body>

<div class="container py-5">
    <h2 class="text-center mb-4">Our Courses</h2>

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <div class="card">
                <img src="../Assets/images/htmllogo.jpg" class="card-img-top">
                <div class="card-body">
                    <h5>HTML Course</h5>
                    <p>Trainer: John</p>
                    <p>₹999</p>
                    <button class="btn btn-primary w-100">Enroll</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <div class="card">
                <img src="../Assets/images/cssnew.webp" class="card-img-top">
                <div class="card-body">
                    <h5>CSS Course</h5>
                    <p>Trainer: David</p>
                    <p>₹1199</p>
                    <button class="btn btn-success w-100">Enroll</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <div class="card">
                <img src="../Assets/images/js.jpg" class="card-img-top">
                <div class="card-body">
                    <h5>JavaScript</h5>
                    <p>Trainer: Alex</p>
                    <p>₹1499</p>
                    <button class="btn btn-warning w-100">Enroll</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <div class="card">
                <img src="../Assets/images/bootstrap.jpg" class="card-img-top">
                <div class="card-body">
                    <h5>Bootstrap</h5>
                    <p>Trainer: Smith</p>
                    <p>₹899</p>
                    <button class="btn btn-danger w-100">Enroll</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <div class="card">
                <img src="../Assets/images/react.jpg" class="card-img-top">
                <div class="card-body">
                    <h5>React JS</h5>
                    <p>Trainer: Kevin</p>
                    <p>₹1999</p>
                    <button class="btn btn-dark w-100">Enroll</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <div class="card">
                <img src="../Assets/images/python.png" class="card-img-top">
                <div class="card-body">
                    <h5>Python</h5>
                    <p>Trainer: Michael</p>
                    <p>₹2499</p>
                    <button class="btn btn-info w-100">Enroll</button>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
