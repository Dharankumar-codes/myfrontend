<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <h1 class="text-3xl font-bold text-center mb-6">
        Image Gallery
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

        <div class="overflow-hidden rounded-lg">
            <img src="../Assets/images/nature.webp"
                 alt="Image 1"
                 class="w-full h-64 object-cover transition duration-300 hover:scale-110">
        </div>

        <div class="overflow-hidden rounded-lg">
            <img src="../Assets/images/nature2.jpg"
                 alt="Image 2"
                 class="w-full h-64 object-cover transition duration-300 hover:scale-110">
        </div>

        <div class="overflow-hidden rounded-lg">
            <img src="../Assets/images/nature3.jpg"
                 alt="Image 3"
                 class="w-full h-64 object-cover transition duration-300 hover:scale-110">
        </div>

        <div class="overflow-hidden rounded-lg">
            <img src="../Assets/images/nature4.jpg"
                 alt="Image 4"
                 class="w-full h-64 object-cover transition duration-300 hover:scale-110">
        </div>

        <div class="overflow-hidden rounded-lg">
            <img src="../Assets/images/nature5.jpg"
                 alt="Image 5"
                 class="w-full h-64 object-cover transition duration-300 hover:scale-110">
        </div>

        <div class="overflow-hidden rounded-lg">
            <img src="../Assets/images/nature6.jpg"
                 alt="Image 6"
                 class="w-full h-64 object-cover transition duration-300 hover:scale-110">
        </div>

    </div>

</body>
</html>
